# Dev profile datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coffeedb;DB_CLOSE_DELAY=-1

# Auto-create schema and seed data on startup
quarkus.hibernate-orm.database.generation=drop-and-create

# Log generated SQL (helpful for learning)
quarkus.hibernate-orm.log.sql=true

quarkus.swagger-ui.always-include=true

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true