<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Quarkus Cafe — Barista Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ── Chat card ── */
    .card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 620px;
      overflow: hidden;
    }

    /* ── Header ── */
    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }
    .avatar {
      width: 36px; height: 36px;
      background: #1d4ed8;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-header h1 { font-size: 1rem; font-weight: 600; color: #1f2328; }
    .card-header p  { font-size: 0.78rem; color: #57606a; margin-top: 1px; }

    /* ── Messages pane ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* empty-state hint */
    .empty {
      margin: auto;
      text-align: center;
      color: #8b949e;
      font-size: 0.85rem;
      line-height: 1.7;
    }
    .empty strong { display: block; font-size: 1.1rem; margin-bottom: 0.3rem; color: #57606a; }

    /* bubble rows */
    .row       { display: flex; flex-direction: column; max-width: 78%; }
    .row.user  { align-self: flex-end; align-items: flex-end; }
    .row.bot   { align-self: flex-start; align-items: flex-start; }

    .sender {
      font-size: 0.68rem;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 3px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.user .bubble { background: #1d4ed8; color: #ffffff; border-bottom-right-radius: 4px; }
    .row.bot  .bubble { background: #f7f8fa; color: #1f2328; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }

    /* ── Input bar ── */
    .input-bar {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 0.5rem; }
    input[type=text] {
      flex: 1;
      padding: 0.55rem 0.85rem;
      font-size: 0.95rem;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      outline: none;
      color: #1f2328;
    }
    input[type=text]:focus { border-color: #3b82d4; }
    button {
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-send  { background: #1d4ed8; color: #fff; }
    .btn-send:hover  { background: #1e40af; }
    .btn-clear { background: #f7f8fa; color: #57606a; border: 1px solid #d0d7de; }
    .btn-clear:hover { background: #e5e7eb; }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="avatar">☕</div>
    <div>
      <h1>Barista Bot</h1>
      <p>Powered by OpenAI · Quarkus LangChain4j</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="msgs">
    {#if history}
      {#for turn in history}
        {#if turn.role == "user"}
        <div class="row user">
          <span class="sender">You</span>
          <div class="bubble">{turn.text}</div>
        </div>
        {#else}
        <div class="row bot">
          <span class="sender">Barista Bot</span>
          <div class="bubble">{turn.text}</div>
        </div>
        {/if}
      {/for}
    {#else}
      <div class="empty">
        <strong>☕ Welcome!</strong>
        Ask me anything about coffee, our menu,<br>or how your favourite drink is made.
      </div>
    {/if}
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <form method="post" action="/">
      <div class="input-row">
        <input type="text" name="message"
               placeholder="e.g. What's in a flat white?" autofocus>
        <button type="submit" class="btn-send">Send</button>
        <a href="/"><button type="button" class="btn-clear">Clear</button></a>
      </div>
    </form>
  </div>

</div>

</body>
</html>
