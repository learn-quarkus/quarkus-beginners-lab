# OpenAI model config
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# MCP client — connect to menu-mcp-server on port 8084
# (Lab 10 runs menu-mcp-server on 8084 so it doesn't clash with order-service on 8081)
quarkus.langchain4j.mcp.menu.transport-type=http
quarkus.langchain4j.mcp.menu.url=http://localhost:8084/mcp/sse
quarkus.langchain4j.mcp.menu.log-requests=true
quarkus.langchain4j.mcp.menu.log-responses=true

# REST client — connect to order-flow-service on port 8082
quarkus.rest-client.order-flow-service.url=http://localhost:8082
