<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 896" width="1280" height="896"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">

  <defs>
    <marker id="a-slate" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8.5,3.2 z" fill="#475569"/>
    </marker>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8.5,3.2 z" fill="#15803d"/>
    </marker>
    <marker id="a-amber" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8.5,3.2 z" fill="#b45309"/>
    </marker>
    <marker id="a-purple" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8.5,3.2 z" fill="#7e22ce"/>
    </marker>
    <filter id="card-shadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .band      { fill:#ffffff; stroke:#e5e7eb; stroke-width:1.2; stroke-dasharray:5 4; }
    .bandlabel { font-size:10.5px; font-weight:700; letter-spacing:1.3px; fill:#94a3b8; }
    .card      { fill:#ffffff; stroke:#d5dbe3; stroke-width:1.5; filter:url(#card-shadow); }
    .title     { font-size:12.5px; font-weight:700; }
    .body      { font-size:10.5px; fill:#475569; }
    .badge     { font-size:9px; font-weight:600; }
    .edge      { font-size:9px; fill:#475569; }
    .person    { font-size:13px; font-weight:700; fill:#334155; }
    .personsub { font-size:10.5px; fill:#64748b; }
  </style>

  <!-- ══ canvas ══ -->
  <rect width="1280" height="896" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ══ title ══ -->
  <text x="640" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Quarkus Cafe — Final Architecture</text>
  <text x="640" y="70" text-anchor="middle" font-size="13" fill="#64748b">Five Quarkus services built across Labs 1–10 — all running on your laptop</text>

  <!-- ══════════════ BANDS ══════════════ -->
  <rect class="band" x="30" y="90"  width="1220" height="104" rx="14"/>
  <rect class="band" x="30" y="210" width="1220" height="196" rx="14"/>
  <rect class="band" x="30" y="422" width="1220" height="196" rx="14"/>
  <rect class="band" x="30" y="634" width="1220" height="140" rx="14"/>

  <text class="bandlabel" x="990" y="112" text-anchor="end">CUSTOMERS &amp; STAFF</text>
  <text class="bandlabel" x="990" y="232" text-anchor="end">AI LAYER — LABS 7 · 8</text>
  <text class="bandlabel" x="990" y="444" text-anchor="end">SERVICES &amp; WORKFLOW — LABS 1–6 · 10</text>
  <text class="bandlabel" x="990" y="656" text-anchor="end">PLATFORM &amp; OPERATIONS — LABS 2 · 4 · 5 · 9</text>

  <!-- ══════════════ BAND 1 — people ══════════════ -->

  <!-- Customer -->
  <rect class="card" x="372" y="124" width="250" height="56" rx="12"/>
  <text class="person"    x="386" y="146">👤  Customer</text>
  <text class="personsub" x="386" y="165">asks about the menu · orders coffee</text>

  <!-- Staff / Admin -->
  <rect class="card" x="1004" y="124" width="246" height="56" rx="12"/>
  <text class="person"    x="1018" y="146">🛠  Staff / Admin</text>
  <text class="personsub" x="1018" y="165">adds menu items via the REST API</text>

  <!-- ══════════════ BAND 2 — AI layer ══════════════ -->

  <!-- OpenAI (external) -->
  <rect x="56" y="246" width="250" height="142" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M56,276 L56,258 Q56,246 68,246 L294,246 Q306,246 306,258 L306,276 Z" fill="#f3e8ff"/>
  <text class="title" x="70" y="266" fill="#7e22ce">OpenAI</text>
  <rect x="230" y="253" width="64" height="17" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text class="badge" x="262" y="265" text-anchor="middle" fill="#7e22ce">external</text>
  <text class="body" x="70" y="300">gpt-4o-mini</text>
  <text class="body" x="70" y="318">chat completions + tool calling</text>
  <text class="body" x="70" y="336">🔑 API key required</text>
  <text class="body" x="70" y="354">swap: watsonx · Ollama · Llama</text>

  <!-- barista-bot -->
  <rect class="card" x="372" y="246" width="250" height="142" rx="12"/>
  <path d="M372,276 L372,258 Q372,246 384,246 L610,246 Q622,246 622,258 L622,276 Z" fill="#dcfce7"/>
  <text class="title" x="386" y="266" fill="#15803d">barista-bot   :8080</text>
  <rect x="534" y="253" width="76" height="17" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text class="badge" x="572" y="265" text-anchor="middle" fill="#15803d">Labs 7·8·10</text>
  <text class="body" x="386" y="300">Qute chat UI · session memory</text>
  <text class="body" x="386" y="318">@RegisterAiService</text>
  <text class="body" x="386" y="336">@McpToolBox("menu")</text>
  <text class="body" x="386" y="354">@ToolBox(OrderTools.class)</text>

  <!-- menu-mcp-server -->
  <rect class="card" x="688" y="246" width="250" height="142" rx="12"/>
  <path d="M688,276 L688,258 Q688,246 700,246 L926,246 Q938,246 938,258 L938,276 Z" fill="#dcfce7"/>
  <text class="title" x="702" y="266" fill="#15803d">menu-mcp-server  :8084</text>
  <rect x="870" y="253" width="54" height="17" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text class="badge" x="897" y="265" text-anchor="middle" fill="#15803d">Lab 8</text>
  <text class="body" x="702" y="300">MCP tools over HTTP/SSE</text>
  <text class="body" x="702" y="318">getMenuItems()</text>
  <text class="body" x="702" y="336">getItemPrice(name)</text>
  <text class="body" x="702" y="354">getItemsByMilkOption(milk)</text>

  <!-- ══════════════ BAND 3 — services ══════════════ -->

  <!-- order-flow-service -->
  <rect class="card" x="56" y="458" width="250" height="142" rx="12"/>
  <path d="M56,488 L56,470 Q56,458 68,458 L294,458 Q306,458 306,470 L306,488 Z" fill="#ede9fe"/>
  <text class="title" x="70" y="478" fill="#6d28d9">order-flow-service :8082</text>
  <rect x="242" y="465" width="54" height="17" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="badge" x="269" y="477" text-anchor="middle" fill="#6d28d9">Lab 10</text>
  <text class="body" x="70" y="512">Quarkus Flow workflow</text>
  <text class="body" x="70" y="530">placeOrder → order-service</text>
  <text class="body" x="70" y="548">switch: total ≥ $15 → approval</text>
  <text class="body" x="70" y="566">/admin  ·  /flow/status/{id}</text>

  <!-- order-service -->
  <rect class="card" x="372" y="458" width="250" height="142" rx="12"/>
  <path d="M372,488 L372,470 Q372,458 384,458 L610,458 Q622,458 622,470 L622,488 Z" fill="#dbeafe"/>
  <text class="title" x="386" y="478" fill="#1d4ed8">order-service  :8081</text>
  <rect x="556" y="465" width="54" height="17" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text class="badge" x="583" y="477" text-anchor="middle" fill="#1d4ed8">Lab 4</text>
  <text class="body" x="386" y="512">POST /orders</text>
  <text class="body" x="386" y="530">@Channel("coffee-orders")</text>
  <text class="body" x="386" y="548">publishes an event per order</text>

  <!-- Kafka -->
  <rect class="card" x="688" y="486" width="250" height="86" rx="12"/>
  <path d="M688,516 L688,498 Q688,486 700,486 L926,486 Q938,486 938,498 L938,516 Z" fill="#fef3c7"/>
  <text class="title" x="702" y="506" fill="#b45309">Kafka</text>
  <rect x="836" y="493" width="88" height="17" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text class="badge" x="880" y="505" text-anchor="middle" fill="#b45309">Dev Services</text>
  <text class="body" x="702" y="540">topic  coffee-orders</text>
  <text class="body" x="702" y="558">started automatically</text>

  <!-- menu-service -->
  <rect class="card" x="1004" y="458" width="246" height="142" rx="12"/>
  <path d="M1004,488 L1004,470 Q1004,458 1016,458 L1238,458 Q1250,458 1250,470 L1250,488 Z" fill="#dbeafe"/>
  <text class="title" x="1018" y="478" fill="#1d4ed8">menu-service  :8080</text>
  <rect x="1164" y="465" width="74" height="17" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text class="badge" x="1201" y="477" text-anchor="middle" fill="#1d4ed8">Labs 1–6·9</text>
  <text class="body" x="1018" y="512">GET /menu  ·  /menu/info</text>
  <text class="body" x="1018" y="530">POST /menu 🔒 roles-allowed</text>
  <text class="body" x="1018" y="548">Panache + H2 · @Retry @Fallback</text>
  <text class="body" x="1018" y="566">GET /q/health   live + ready</text>

  <!-- ══════════════ BAND 4 — platform &amp; ops ══════════════ -->

  <!-- Barista -->
  <rect class="card" x="56" y="670" width="250" height="88" rx="12"/>
  <text class="person" x="70" y="700">☕  Barista</text>
  <text class="body"   x="70" y="722">approves high-value orders</text>
  <text class="body"   x="70" y="740">http://localhost:8082/admin</text>

  <!-- Container image -->
  <rect class="card" x="688" y="670" width="250" height="88" rx="12"/>
  <path d="M688,700 L688,682 Q688,670 700,670 L926,670 Q938,670 938,682 L938,700 Z" fill="#ccfbf1"/>
  <text class="title" x="702" y="690" fill="#0f766e">🐳  Container image</text>
  <rect x="872" y="677" width="52" height="17" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text class="badge" x="898" y="689" text-anchor="middle" fill="#0f766e">Lab 9</text>
  <text class="body" x="702" y="722">packages menu-service into</text>
  <text class="body" x="702" y="740">a UBI9 image · podman run</text>

  <!-- Dev Services -->
  <rect class="card" x="1004" y="670" width="246" height="88" rx="12"/>
  <path d="M1004,700 L1004,682 Q1004,670 1016,670 L1238,670 Q1250,670 1250,682 L1250,700 Z" fill="#ccfbf1"/>
  <text class="title" x="1018" y="690" fill="#0f766e">Dev Services</text>
  <rect x="1150" y="677" width="88" height="17" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text class="badge" x="1194" y="689" text-anchor="middle" fill="#0f766e">Labs 2·4·5</text>
  <text class="body" x="1018" y="722">H2 in-memory database</text>
  <text class="body" x="1018" y="740">Keycloak OIDC 🔒 · Kafka</text>

  <!-- ══════════════ EDGES ══════════════ -->

  <!-- Customer → barista-bot -->
  <line x1="497" y1="180" x2="497" y2="242" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <text class="edge" x="507" y="216">opens :8080 in the browser</text>

  <!-- barista-bot ↔ OpenAI -->
  <line x1="368" y1="296" x2="312" y2="296" stroke="#7e22ce" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a-purple)"/>
  <text class="edge" x="340" y="288" text-anchor="middle" fill="#7e22ce">prompt</text>
  <line x1="310" y1="328" x2="366" y2="328" stroke="#7e22ce" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a-purple)"/>
  <text class="edge" x="338" y="320" text-anchor="middle" fill="#7e22ce">reply</text>

  <!-- barista-bot ↔ menu-mcp-server -->
  <line x1="626" y1="296" x2="682" y2="296" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text class="edge" x="654" y="288" text-anchor="middle" fill="#15803d">MCP/SSE</text>
  <line x1="684" y1="328" x2="628" y2="328" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text class="edge" x="656" y="320" text-anchor="middle" fill="#15803d">tools</text>

  <!-- barista-bot → order-flow-service (@Tool) -->
  <path d="M430,388 L430,434 L181,434 L181,452" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <rect x="233" y="424" width="134" height="20" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="438" text-anchor="middle" font-size="9.5" fill="#475569">@Tool → POST /flow/order</text>

  <!-- Barista → order-flow-service -->
  <line x1="181" y1="666" x2="181" y2="606" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <text class="edge" x="191" y="642">clicks Approve</text>

  <!-- order-flow-service → order-service -->
  <line x1="310" y1="529" x2="366" y2="529" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <text x="338" y="521" text-anchor="middle" font-size="8.5" fill="#475569">POST /orders</text>

  <!-- order-service → Kafka -->
  <line x1="626" y1="529" x2="682" y2="529" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#a-amber)"/>
  <text x="654" y="521" text-anchor="middle" font-size="8.5" fill="#b45309">@Channel</text>

  <!-- Kafka → menu-service -->
  <line x1="942" y1="529" x2="998" y2="529" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#a-amber)"/>
  <text x="970" y="521" text-anchor="middle" font-size="8.5" fill="#b45309">@Incoming</text>

  <!-- Staff → menu-service -->
  <line x1="1127" y1="184" x2="1127" y2="452" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <rect x="1050" y="296" width="154" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1127" y="311" text-anchor="middle" font-size="9.5" fill="#475569">🔒 POST /menu</text>
  <text x="1127" y="326" text-anchor="middle" font-size="9" fill="#64748b">OIDC bearer token</text>

  <!-- menu-service → Dev Services -->
  <line x1="1127" y1="604" x2="1127" y2="664" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <text class="edge" x="1137" y="640">JDBC · OIDC</text>

  <!-- ══════════════ LEGEND ══════════════ -->
  <rect x="30" y="790" width="1220" height="58" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>

  <line x1="56" y1="812" x2="90" y2="812" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
  <text x="100" y="816" font-size="10" fill="#334155">REST / HTTP call</text>

  <line x1="210" y1="812" x2="244" y2="812" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#a-amber)"/>
  <text x="254" y="816" font-size="10" fill="#334155">Kafka event</text>

  <line x1="340" y1="812" x2="374" y2="812" stroke="#15803d" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text x="384" y="816" font-size="10" fill="#334155">MCP tool call</text>

  <line x1="480" y1="812" x2="514" y2="812" stroke="#7e22ce" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a-purple)"/>
  <text x="524" y="816" font-size="10" fill="#334155">LLM API call</text>

  <text x="620" y="816" font-size="10" fill="#334155">🔒  OIDC-protected endpoint</text>
  <text x="800" y="816" font-size="10" fill="#334155">Lab N  =  the lab where you build it</text>
  <text x="1020" y="816" font-size="10" fill="#334155">Dev Services  =  auto-started containers</text>

  <!-- ══════════════ FOOTNOTE ══════════════ -->
  <text x="640" y="872" text-anchor="middle" font-size="10" fill="#94a3b8">Ports — barista-bot 8080 · order-service 8081 · order-flow-service 8082 · menu-mcp-server 8084 · menu-service 8080 (Labs 1–6; not running during Lab 10)</text>

</svg>
